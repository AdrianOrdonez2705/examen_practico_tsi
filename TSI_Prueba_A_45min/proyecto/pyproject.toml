[project]
name = "tsi-practica-a"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "prometheus-client>=0.21,<1", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
lab = ["pytest>=8,<10", "httpx>=0.27,<1", "locust>=2.30,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
